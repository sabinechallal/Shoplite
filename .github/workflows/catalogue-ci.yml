name: CI Catalogue

on:
  push:
    branches: [main]
    paths:
      - "shoplite-catalogue-service/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler le service Catalogue
        working-directory: ./shoplite-catalogue-service
        run: mvn -B compile
