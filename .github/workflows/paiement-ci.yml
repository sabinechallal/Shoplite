name: CI Paiement

on:
  push:
    branches: [main]
    paths:
      - "shoplite-paiement-service/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        working-directory: ./shoplite-paiement-service
        run: npm install

      - name: Verifier que le code demarre sans erreur de syntaxe
        working-directory: ./shoplite-paiement-service
        run: node --check index.js
