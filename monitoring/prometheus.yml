global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8084']

  - job_name: 'commande-service'
    static_configs:
      - targets: ['commande-service:8082']

  - job_name: 'catalogue-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['catalogue-service:8081']