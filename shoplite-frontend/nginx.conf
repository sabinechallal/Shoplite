server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular gère ses propres routes (/catalogue, /panier, /paiement...) côté navigateur.
    # Sans cette ligne, un rafraîchissement de page sur /panier donnerait une erreur 404 nginx,
    # car ce chemin n'existe pas physiquement en tant que fichier.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/catalogue/ {
        proxy_pass http://catalogue-service:8081/;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8084/;
    }

    location /api/commande/ {
        proxy_pass http://commande-service:8082/;
    }

    location /api/paiement/ {
        proxy_pass http://paiement-service:8083/;
    }
}