server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/catalogue/ {
        rewrite ^/api/catalogue/(.*)$ /api/$1 break;
        proxy_pass http://catalogue-service:8081;
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /api/$1 break;
        proxy_pass http://auth-service:8084;
    }

    location /api/commande/ {
        rewrite ^/api/commande/(.*)$ /api/$1 break;
        proxy_pass http://commande-service:8082;
    }

    location /api/paiement/ {
        rewrite ^/api/paiement/(.*)$ /api/$1 break;
        proxy_pass http://paiement-service:8083;
    }
}