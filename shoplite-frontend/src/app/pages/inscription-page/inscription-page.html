<div class="inscription-container">
  <div class="carte-inscription">
    <h1>Creer un compte</h1>

    <form (ngSubmit)="sInscrire()">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        required
      />

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        required
      />

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      />

      @if (password()) {
        <ul class="checklist-mot-de-passe">
          <li [class.valide]="longueurValide()" [class.invalide]="!longueurValide()">
            Au moins 12 caracteres
          </li>
          <li [class.valide]="majusculeValide()" [class.invalide]="!majusculeValide()">
            Une majuscule
          </li>
          <li [class.valide]="minusculeValide()" [class.invalide]="!minusculeValide()">
            Une minuscule
          </li>
          <li [class.valide]="chiffreValide()" [class.invalide]="!chiffreValide()">
            Un chiffre
          </li>
          <li [class.valide]="caractereSpecialValide()" [class.invalide]="!caractereSpecialValide()">
            Un caractere special (! @ # $ ...)
          </li>
        </ul>
      }

      @if (erreur()) {
        <p class="message-erreur">{{ erreur() }}</p>
      }

      <button type="submit" [disabled]="password().length > 0 && !motDePasseValide()">
        S'inscrire
      </button>
    </form>

    <p class="lien-connexion">
      Deja un compte ? <a routerLink="/connexion">Se connecter</a>
    </p>
  </div>
</div>
