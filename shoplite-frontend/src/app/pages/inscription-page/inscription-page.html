
<div class="inscription-container">
  <div class="carte-inscription">
    <h1>Creer un compte</h1>

    <form (ngSubmit)="sInscrire()">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        required
      />

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        required
      />

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      />

      @if (erreur()) {
        <p class="message-erreur">{{ erreur() }}</p>
      }

      <button type="submit">S'inscrire</button>
    </form>

    <p class="lien-connexion">
      Deja un compte ? <a routerLink="/connexion">Se connecter</a>
    </p>
  </div>
</div>
